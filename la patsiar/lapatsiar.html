<section><div class="wrap intro rv"><span class="label">Bienvenue</span><h2>יותר מקפה. רגע קטן של פריז.</h2><span class="fr">Un petit moment de Paris</span><div class="rule"></div><p>מקום קטן לעצירה, לנשימה ולביס טוב. (טקסט דמו – יוחלף בנוסח הקפה.)</p></div></section>
<section style="background:var(--sand)"><div class="wrap rv"><div class="ctl"><h2 style="margin:0">מנות חתימה</h2><div><button id="pv" aria-label="הקודם">›</button> <button id="nx" aria-label="הבא">‹</button></div></div><div class="car" id="car" tabindex="0" aria-label="קרוסלת מנות">${M.filter((_,i)=>[4,6,0,7,2].includes(i)).map(card).join("")}</div><p style="margin-top:24px">${cta("#menu","לתפריט המלא")}</p></div></section>
<section><div class="wrap rv"><h2>רגעים מהקפה</h2><div class="bento" id="bt"></div><p style="margin-top:24px">${cta("#gallery","לגלריה המלאה")}</p></div></section>
<section style="background:var(--sand)"><div class="wrap split rv"><div class="img">${ph("about-1",2)}</div><div><span class="label">Notre histoire</span><h2>הסיפור שלנו</h2><p>השראה צרפתית, אפייה בעבודת יד ואירוח חם. (טקסט דמו – אין כאן עובדות מאומתות על העסק.)</p>${cta("#about","להכיר אותנו")}</div></div></section>
<section><div class="wrap rv"><div class="team">${ph("team-cover",4)}</div><h2>האנשים שמאחורי הטעם</h2><p style="max-width:640px">תשוקה, מקצועיות ואירוח – צוות שדואג שתרגישו בבית. (דמו)</p>${cta("#about","עוד עלינו")}</div></section>
<section class="dark"><div class="wrap split rv"><div class="img" style="height:380px">${ph("location",5)}</div><div><h2>מיקום ושעות פתיחה</h2><p>${CFG.address}</p><p><a class="btn" style="border-color:#F4EFE6" target="_blank" rel="noopener" href="${CFG.maps}${encodeURIComponent(CFG.address)}">ניווט בגוגל מפות</a> <a class="btn" style="border-color:#F4EFE6" href="tel:${CFG.phone}">חיוג</a></p>${hoursRows()}</div></div></section>${contact()}`,
menu:()=>`${cover("התפריט שלנו","מבחר דמו – מחירים, רכיבים ואלרגנים יש להשלים.","menu-cover",6)}<div class="cats" role="group" aria-label="קטגוריות"><input id="q" type="search" placeholder="חיפוש מנה" aria-label="חיפוש" style="max-width:200px"><button class="chip" data-c="" aria-pressed="true">הכל</button>${CATS.map(c=>`<button class="chip" data-c="${c}" aria-pressed="false">${c}</button>`).join("")}</div><section style="padding-top:40px"><div class="wrap"><h2 class="sr">רשימת מנות</h2><div class="grid" id="mg"></div><p id="ne" hidden>לא נמצאו מנות.</p></div></section>`,
gallery:()=>`${cover("הרגעים שלנו","תמונות דמו – להחלפה בצילומי הקפה.","gal-cover",7)}<div class="cats" role="group" aria-label="קטגוריות גלריה">${GC.map((c,i)=>`<button class="chip" data-g="${i}" aria-pressed="${i==0}">${c}</button>`).join("")}</div><section style="padding-top:40px"><div class="wrap"><h2 class="sr">תמונות</h2><div class="bento" id="gg"></div></div></section>`,
about:()=>`${cover("הסיפור שלנו","פטיסרי וקפה בהשראה צרפתית.","about-cover",8)}<section><div class="wrap split"><div><h2>על הקפה</h2><p>[תיאור הקפה, ההשראה הצרפתית, שנות הפעילות ומה שמייחד אותנו – להשלמה על ידי הבעלים. לא הוזנו עובדות היסטוריות.]</p></div><div class="img">${ph("about-2",9)}</div></div></section><section><div class="wrap"><div class="team">${ph("team-cover",4)}</div><h2>האנשים שמאחורי הטעם</h2><p>[הצגת הצוות – להשלמה, ללא שמות בדויים.]</p>${cta("#contact","בואו לבקר")}</div></section>`,
contact:()=>`${cover("מיקום ויצירת קשר","נשמח לארח אתכם.","contact-cover",10)}<section><div class="wrap split"><div><h2>כתובת</h2><p>${CFG.address}</p><p><a class="btn" target="_blank" rel="noopener" href="${CFG.maps}${encodeURIComponent(CFG.address)}">ניווט בגוגל מפות</a></p><p class="demo">מפה מוטמעת: מוגדרת לאחר הזנת כתובת אמיתית</p></div><div>${hoursRows()}</div></div></section>${contact()}`,
nf:()=>`<section class="page" style="text-align:center;padding-top:160px"><h1>404</h1><p>העמוד לא נמצא.</p><a class="btn fill" href="#home">חזרה לראשי</a></section>`};
let tm=[],lbIdx=0,lbSet=[];
function clr(){tm.forEach(clearInterval);tm=[]}
const rm=matchMedia("(prefers-reduced-motion:reduce)").matches;
function route(){clr();let r=location.hash.slice(1)||"home";const ok=R.some(x=>x[0]==r);const m=$("#main");m.className=ok&&r!="home"?"page":"";m.innerHTML=(V[ok?r:"nf"])();
$("#lk").innerHTML=R.map(x=>`<a href="#${x[0]}" ${x[0]==r?'aria-current="page"':""}>${x[1]}</a>`).join("")+'<a class="btn fill" href="#contact" id="mc">בואו לבקר</a>';
closeNav();window.scrollTo({top:0,behavior:"instant"});document.title=(ok?R.find(x=>x[0]==r)[1]+" | ":"404 | ")+"LA PATSIAR";hdr();
$$(".rv").forEach(e=>io.observe(e));
if(r=="home"&&ok){const s=$$(".slide");let i=0;const d=$$("#dots button"),go=n=>{s[i].classList.remove("on");d[i].classList.remove("on");i=n;s[i].classList.add("on");d[i].classList.add("on")};d.forEach(b=>b.onclick=()=>go(+b.dataset.s));if(!rm)tm.push(setInterval(()=>go((i+1)%s.length),6000));car();bento()}
if(r=="menu")menu();if(r=="gallery")gal(0);
const f=$("#cf");if(f)f.onsubmit=submit;
}
const io=new IntersectionObserver(es=>es.forEach(e=>e.isIntersecting&&e.target.classList.add("in")),{threshold:.12});
function car(){const c=$("#car");if(!c)return;const step=()=>c.firstElementChild.offsetWidth+22;
$("#nx").onclick=()=>c.scrollBy({left:-step(),behavior:"smooth"});$("#pv").onclick=()=>c.scrollBy({left:step(),behavior:"smooth"});
let down=0,sx=0,sl=0,hov=0,mv=0;c.onmousedown=e=>{down=1;mv=0;sx=e.pageX;sl=c.scrollLeft;c.style.scrollSnapType="none"};
window.onmouseup=()=>{if(down){down=0;c.style.scrollSnapType=""}};c.onmousemove=e=>{if(down){mv=Math.abs(e.pageX-sx);c.scrollLeft=sl-(e.pageX-sx)}};c.addEventListener("click",e=>{if(mv>5){e.stopPropagation();e.preventDefault();mv=0}},true);
c.onmouseenter=()=>hov=1;c.onmouseleave=()=>hov=0;c.onfocusin=()=>hov=1;c.onfocusout=()=>hov=0;c.ontouchstart=()=>hov=1;
if(!rm)tm.push(setInterval(()=>{if(hov)return;const mx=c.scrollWidth-c.clientWidth;Math.abs(c.scrollLeft)>=mx-4?c.scrollTo({left:0,behavior:"smooth"}):c.scrollBy({left:-step(),behavior:"smooth"})},5000))}
function bento(){const b=$("#bt");if(!b)return;const cls=["t1","t2","","t3","","t2","","t3",""];let shown=[0,1,2,3,4,5,6,7,8];const pool=[9,10,11,12,13];
b.innerHTML=shown.map((p,i)=>`<button class="${cls[i]}" data-g="${i}" data-k="gallery-${p}" data-i="${p}" aria-label="פתיחת תמונה ${i+1}">${ph("gallery-"+p,p)}</button>`).join("");
if(rm)return;tm.push(setInterval(()=>{const slot=Math.floor(Math.random()*9),el=b.children[slot],nw=pool.shift();pool.push(shown[slot]);
el.classList.add("fade");setTimeout(()=>{shown[slot]=nw;el.innerHTML=ph("gallery-"+nw,nw);el.dataset.k="gallery-"+nw;el.dataset.i=nw;el.classList.remove("fade")},650)},4500))}
function menu(){let cat="",q="";const g=$("#mg"),draw=()=>{const l=M.filter(m=>(!cat||m.cat==cat)&&(m.name+m.desc).includes(q));g.innerHTML=l.map(card).join("");$("#ne").hidden=!!l.length};draw();
$$("[data-c]").forEach(b=>b.onclick=()=>{cat=b.dataset.c;$$("[data-c]").forEach(x=>x.setAttribute("aria-pressed",x==b));draw()});$("#q").oninput=e=>{q=e.target.value.trim();draw()}}
function gal(i){lbSet=Array.from({length:9},(_,k)=>["gal-"+(i*9+k),i*9+k]);const g=$("#gg"),cls=["t1","t2","","t3","","t2","","t3",""];g.innerHTML=lbSet.map((p,k)=>`<button class="${cls[k]}" data-l="${k}" aria-label="${GC[i]} – הגדלה">${ph(p[0],p[1],GC[i]+" – תמונה זמנית")}</button>`).join("");
$$("[data-g]").forEach(b=>b.onclick=()=>{$$("[data-g]").forEach(x=>x.setAttribute("aria-pressed",x==b));gal(+b.dataset.g)})}
function lb(k){const d=$("#dg");lbIdx=(k+lbSet.length)%lbSet.length;d.className="lb";d.innerHTML=`<button class="x" data-x aria-label="סגירה">✕</button>${ph(lbSet[lbIdx][0],lbSet[lbIdx][1],"תמונה זמנית")}<div class="nav2"><button data-p aria-label="הקודמת">›</button><span>${lbIdx+1}/${lbSet.length}</span><button data-n aria-label="הבאה">‹</button></div>`;if(!d.open)d.showModal()}
let trig=null;
document.addEventListener("click",e=>{const t=e.target.closest("button,a");if(!t)return;
if(t.dataset.d!==undefined){trig=t;const m=M[t.dataset.d],d=$("#dg");d.className="";d.innerHTML=`<button class="x" data-x aria-label="סגירה">✕</button>${ph(m.key,m.id)}<div class="b"><span class="demo">תוכן דמו</span><h2>${m.name}</h2><p>${m.desc}</p><p class="price">${m.price}</p><p><b>רכיבים:</b> ${m.ing}</p><p><b>אלרגנים:</b> ${m.all}</p></div>`;d.showModal();document.body.style.overflow="hidden"}
else if(t.dataset.l!==undefined){trig=t;lb(+t.dataset.l);document.body.style.overflow="hidden"}
else if(t.parentElement&&t.parentElement.id=="bt"){trig=t;lbSet=$$("#bt button").map(b=>[b.dataset.k,+b.dataset.i]);lb(+t.dataset.g);document.body.style.overflow="hidden"}
else if(t.dataset.x!==undefined)$("#dg").close();else if(t.dataset.p!==undefined)lb(lbIdx-1);else if(t.dataset.n!==undefined)lb(lbIdx+1)});
$("#dg").addEventListener("click",e=>{if(e.target.id=="dg")e.target.close()});
$("#dg").addEventListener("close",()=>{document.body.style.overflow="";trig&&trig.focus()});
$("#dg").addEventListener("keydown",e=>{if($("#dg").className=="lb"){if(e.key=="ArrowRight")lb(lbIdx-1);if(e.key=="ArrowLeft")lb(lbIdx+1)}});
let sx0=0;$("#dg").addEventListener("touchstart",e=>sx0=e.touches[0].clientX);$("#dg").addEventListener("touchend",e=>{if($("#dg").className!="lb")return;const d=e.changedTouches[0].clientX-sx0;if(Math.abs(d)>50)lb(lbIdx+(d>0?-1:1))});
function submit(e){e.preventDefault();const g=i=>$("#"+i).value.trim(),fm=$("#fm");fm.hidden=false;
if($("#hp").value)return;if(!g("n")||!/^[0-9+\-\s]{7,}$/.test(g("p"))||!g("m")||(g("e")&&!/^\S+@\S+\.\S+$/.test(g("e")))||!$("#c").checked){fm.textContent="נא למלא שם, טלפון תקין והודעה, ולאשר את ההסכמה.";return}
if(!CFG.formEndpoint){fm.textContent="הטופס טרם חובר לשרת, ולכן ההודעה לא נשלחה. אפשר לפנות בוואטסאפ או בטלפון.";return}
fm.textContent="שולח...";fetch(CFG.formEndpoint,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:g("n"),phone:g("p"),email:g("e"),message:g("m")})}).then(r=>{if(!r.ok)throw 0;fm.textContent="ההודעה נשלחה, תודה!";e.target.reset()}).catch(()=>fm.textContent="אירעה שגיאה בשליחה. נסו שוב או פנו בוואטסאפ.")}
/* nav, scroll, a11y */
function closeNav(){$("#lk").classList.remove("open");$("#bg").setAttribute("aria-expanded","false");document.body.style.overflow=""}
$("#bg").onclick=()=>{const o=$("#lk").classList.toggle("open");$("#bg").setAttribute("aria-expanded",o);document.body.style.overflow=o?"hidden":""};
$("#lk").addEventListener("click",e=>{if(e.target.tagName=="A")closeNav()});
document.addEventListener("keydown",e=>{if(e.key=="Escape"){closeNav();$("#ap").classList.remove("open");$("#ab").setAttribute("aria-expanded","false")}});
function hdr(){const solid=scrollY>40||(location.hash.slice(1)||"home")!="home";$("#hd").classList.toggle("solid",solid);$("#up").hidden=scrollY<500}
addEventListener("scroll",hdr,{passive:true});addEventListener("hashchange",()=>{route();$("#main").focus({preventScroll:true})});$("#skip").onclick=e=>{e.preventDefault();$("#main").focus()};$("#up").onclick=()=>scrollTo({top:0,behavior:rm?"auto":"smooth"});
$("#wa").href="https://wa.me/"+CFG.wa+"?text="+encodeURIComponent("שלום, אשמח לשמוע פרטים");
$("#fa").textContent=CFG.address+" · "+CFG.phone;$("#fn").innerHTML=R.map(x=>`<a href="#${x[0]}">${x[1]}</a>`).join("");$("#fh").innerHTML=hoursRows().replace('class="hours"','class="hours" style="color:#F4EFE6"');
$("#ab").onclick=()=>{const o=$("#ap").classList.toggle("open");$("#ab").setAttribute("aria-expanded",o)};
let fs=100;$$("#ap button").forEach(b=>b.onclick=()=>{const a=b.dataset.a;if(a=="plus")fs=Math.min(140,fs+10);if(a=="minus")fs=Math.max(80,fs-10);
if(a=="reset"){fs=100;["hc","gs","ul","hf"].forEach(c=>document.body.classList.remove(c))}else if(["hc","gs","ul","hf"].includes(a))document.body.classList.toggle(a);
document.documentElement.style.setProperty("--fs",fs+"%");if(["hc","gs","ul","hf"].includes(a))b.setAttribute("aria-pressed",document.body.classList.contains(a));if(a=="reset")$$("#ap [aria-pressed]").forEach(x=>x.setAttribute("aria-pressed","false"))});
route();
</script>
</body>
</html>
